version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release so that freshly published
    # (and potentially compromised) versions are not pulled in immediately.
    cooldown:
      default-days: 7
    groups:
      all-go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release so that freshly published
    # (and potentially compromised) versions are not pulled in immediately.
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
