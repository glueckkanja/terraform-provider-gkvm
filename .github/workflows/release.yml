name: Release

on:
  push:
    tags:
      - "v*"

# Deny everything at the workflow level; the job grants only what it needs.
permissions: {}

# Serialise releases per tag. Unlike CI, a release in flight must never be
# cancelled: it would leave a tag partially published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release and upload assets.
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot silently
      # change what runs here. Dependabot opens PRs when new versions ship.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser publishes through the GitHub API using GITHUB_TOKEN
          # below, so no git credentials need to be left on disk.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caching is disabled on the release path: a cache entry poisoned by
          # a lower-privileged workflow run must not be able to influence the
          # artifacts that get signed and published here.
          cache: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
