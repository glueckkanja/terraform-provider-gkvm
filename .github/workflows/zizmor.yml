---
name: zizmor

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly, so that newly released zizmor audits are caught on a quiet
    # repository instead of surfacing in the next org-wide scan.
    - cron: '17 6 * * 1'

# Deny everything at the workflow level; the job grants only what it needs.
permissions: {}

concurrency:
  group: zizmor-${{ github.event.pull_request.head.repo.full_name || github.repository }}/${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Pinned deliberately: a new zizmor release must not be able to turn a green
  # pull request red without a visible, reviewable version bump in this file.
  ZIZMOR_VERSION: 1.30.1

jobs:
  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the workflows being audited.
      security-events: write # Required to publish findings to Code Scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # SARIF mode always exits 0, even when there are findings, so this step
      # only produces the report. The "Fail on findings" step below is what
      # actually gates the pull request.
      - name: Run zizmor (SARIF report)
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Best effort: org policy can deny the security-events scope, and that
      # must not silently hide findings — the next step still fails the build.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: zizmor

      # Default output format, which unlike SARIF exits non-zero on findings
      # and prints them readably in the job log.
      - name: Fail on findings
        run: uvx "zizmor@${ZIZMOR_VERSION}" .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
